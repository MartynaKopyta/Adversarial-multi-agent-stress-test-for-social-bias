# This is the experiment config for the main experiment as described in the methodology
models:
  persuader: "x-ai/grok-4.3"
  persuadee:
    - "google/gemini-3.1-flash-lite"
    - "meta-llama/llama-3.3-70b-instruct"
    - "openai/gpt-4o-mini"
  judge: "deepseek/deepseek-chat-v3-0324"
  safety: "meta-llama/llama-guard-4-12b"

experiment:
  n_turns: 10
  strategies: ["logos", "ethos", "pathos"]
  bias_types: ["gender", "race"]
  stance_checkpoints: [0, 5, 10] 
  claim_source: "inferred"   # "inferred" (default) or "dataset"

reliability:
  enabled: false
  n_replicates: 1
  n_starters_per_bias_type: 1

pilot:
  n_starters: 1
  persuadee_models:
    - "google/gemini-3.1-flash-lite"
    - "openai/gpt-4o-mini"
    - "meta-llama/llama-3.3-70b-instruct"

    

api:
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 5
  max_parallel_conversations: 10
  concurrency_limits:
    "x-ai/grok-4.3": 3
    "meta-llama/llama-3.3-70b-instruct": 5
    "openai/gpt-4o-mini": 5
    "google/gemini-3.1-flash-lite": 5
    "deepseek/deepseek-chat-v3-0324": 5
    "meta-llama/llama-guard-4-12b": 5

  rpm_limits:
    "x-ai/grok-4.3": 60
    "meta-llama/llama-3.3-70b-instruct": 60
    "openai/gpt-4o-mini": 60
    "google/gemini-3.1-flash-lite": 60
    "deepseek/deepseek-chat-v3-0324": 60
    "meta-llama/llama-guard-4-12b": 60

generation:
  temperature: 0.7
  temperature_judge: 0.0
  temperature_probes: 0.0
  max_tokens_persuader: 600
  max_tokens_persuadee: 500
  max_tokens_judge: 600
  max_tokens_probes: 50
  top_p: 0.92
  frequency_penalty: 0.1
  # reasoning_effort: {}  # empty by default, add per-model overrides:
  reasoning_effort:
    "google/gemini-3.1-flash-lite": "low"

paths:
  data_files:
    - "data/processed/gender.csv"
    - "data/processed/race.csv"
  results_dir: "results"
  checkpoints_dir: "results/checkpoints"
  final_dir: "results/final"
  logs_dir: "results/logs"