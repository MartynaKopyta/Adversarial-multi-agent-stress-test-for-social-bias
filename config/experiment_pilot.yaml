# Example setup for the pilot run

models:
  persuader: "x-ai/grok-3"
  persuadee:
    - "microsoft/phi-4"
    - "meta-llama/llama-3.3-70b-instruct"
    - "openai/gpt-4o-mini"
  judge: "deepseek/deepseek-chat-v3-0324"
  safety: "meta-llama/llama-guard-4-12b"

experiment:
  n_turns: 10
  strategies: ["logos", "ethos", "pathos"]
  bias_types: ["gender"]
  stance_checkpoints: [0, 5, 10]

reliability:
  enabled: false
  n_replicates: 1
  n_starters_per_bias_type: 1

pilot:
  n_starters: 1
  persuadee_models:
    - "microsoft/phi-4"
    - "meta-llama/llama-3.3-70b-instruct"
    - "openai/gpt-4o-mini"
    

api:
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 5
  concurrency_limits:
    "x-ai/grok-3": 3
    "meta-llama/llama-3.3-70b-instruct": 5
    "openai/gpt-4o-mini": 5
    "microsoft/phi-4": 3
    "deepseek/deepseek-chat-v3-0324": 5
    "meta-llama/llama-guard-4-12b": 5

  rpm_limits:
    "x-ai/grok-3": 60
    "meta-llama/llama-3.3-70b-instruct": 60
    "openai/gpt-4o-mini": 60
    "microsoft/phi-4": 60
    "deepseek/deepseek-chat-v3-0324": 60
    "meta-llama/llama-guard-4-12b": 60

generation:
  temperature: 0.7
  temperature_judge: 0.0
  temperature_probes: 0.0
  max_tokens_persuader: 600
  max_tokens_persuadee: 600
  max_tokens_judge: 500
  max_tokens_probes: 50

paths:
  data_dir: "data/processed"
  gender_file: "data/processed/gender.csv"
  race_file: "data/processed/race.csv"
  results_dir: "results"
  checkpoints_dir: "results/checkpoints"
  final_dir: "results/final"
  logs_dir: "results/logs"